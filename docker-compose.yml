services:
  # 1. PostgreSQL Database with automatic schema & seed initialization
  db:
    image: postgres:16-alpine
    container_name: project_engineer_db
    environment:
      POSTGRES_DB: project_engineer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_engineer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_engineer_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/project_engineer
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 3. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_engineer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
